# openHAB Exporter Configuration
# This file configures the openHAB exporter service

# openHAB connection settings
openhab:
  # Base URL of the openHAB instance
  base_url: "http://openhab:8080"
  
  # HTTP timeout for openHAB API requests (seconds)
  timeout: 10.0
  
  # Persistence service name (e.g., "influxdb", "rrd4j", or null to disable)
  persistence_service: "influxdb"
  
  # Authentication (use either username/password OR api_token, not both)
  auth:
    # Basic authentication
    username: null  # Set to username if using basic auth
    password: null  # Set to password if using basic auth
    
    # OR use API token (Bearer token) - leave username/password as null if using token
    api_token: ""
  
  # Verify TLS certificates (true/false)
  tls_verify: true

# MQTT broker settings
mqtt:
  # MQTT broker hostname or IP
  broker_host: "mqtt-broker"
  
  # MQTT broker port
  broker_port: 1883
  
  # Topic prefix for publishing (will be combined with site_id: {topic_prefix}/{site_id}/export)
  topic_prefix: "openhab"
  
  # MQTT Quality of Service level (0, 1, or 2)
  # 0: At most once (fire and forget)
  # 1: At least once (default, ensures delivery)
  # 2: Exactly once (most reliable, but slower)
  qos: 1
  
  # Retain messages (true/false)
  # If true, broker will keep last message on topic for new subscribers
  retain: false
  
  # MQTT authentication (optional, leave null for anonymous access)
  username: null
  password: null

# Exporter settings
exporter:
  # Interval between export cycles (seconds)
  interval_seconds: 300
  
  # Site ID (can be set directly or loaded from file)
  site_id: null  # Set directly here, or leave null to use site_id_file
  
  # Path to file containing site ID (read if site_id is null)
  site_id_file: "/data/site/ID"
  
  # Maximum number of retries for failed MQTT publish attempts
  max_retries: 3

