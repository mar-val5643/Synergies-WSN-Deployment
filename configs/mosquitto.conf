# Mosquitto MQTT Broker Configuration
# Basic configuration for demo purposes

# Listener on port 1883 (standard MQTT port)
listener 1883
protocol mqtt

# Allow anonymous connections (for demo purposes)
# In production, this should be disabled and proper authentication should be used
allow_anonymous true

# Persistence
# Store connection, subscription and message data in memory
persistence true
persistence_location /mosquitto/data/

# Logging
# Log to stdout and stderr
log_dest stdout
log_dest stderr
log_type all

# Connection settings
max_connections -1
max_inflight_messages 20
max_queued_messages 1000

# Message settings
# max_packet_size removed - using default (unlimited)
# For large messages, you can set: max_packet_size 268435456 (256MB)

# Retained messages
retained_persistence true

