version: '3.9'

services:
  openhab:
    image: openhab/openhab:5.1.4
    container_name: openhab
    ports:
      - ${OPENHAB_HTTP_PORT}:${OPENHAB_HTTP_PORT}
      - ${OPENHAB_HTTPS_PORT}:${OPENHAB_HTTPS_PORT}
      - ${OPENHAB_CONSOLE_PORT}:${OPENHAB_CONSOLE_PORT}
    depends_on:
      - influxdb
    restart: always
    privileged: true
    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "/etc/timezone:/etc/timezone:ro"
      - data_openhab_conf:/openhab/conf
      - data_openhab_addons:/openhab/addons
      - data_openhab_userdata:/openhab/userdata
      - ./configs/openhab_addons.cfg:/openhab/conf/services/addons.cfg
      - ./configs/influxdb.persist:/openhab/conf/persistence/influxdb.persist
      - ./openhab_services:/openhab/conf/services
    environment:
      TZ: ${TZ}
      OPENHAB_HTTP_PORT: ${OPENHAB_HTTP_PORT}
      OPENHAB_HTTPS_PORT: ${OPENHAB_HTTPS_PORT}
      CRYPTO_POLICY: "unlimited"
      EXTRA_JAVA_OPTS: "-Dgnu.io.rxtx.SerialPorts=/dev/ttyUSB0:/dev/ttyUSB1"
      USER_ID: 999
      GROUP_ID: 994
      LANG: en_US.UTF-8
      LANGUAGE: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    devices:
      - /dev/ttyACM0:/dev/ttyACM0
      - /dev/ttyUSB0:/dev/ttyUSB0 
      - /dev/ttyUSB1:/dev/ttyUSB1 
    networks:
      wsn-bridge:
        aliases:
        - oh

  influxdb:
    image: influxdb:1.8
    container_name: influxdb
    restart: always
    volumes:
      - data_influxdb:/var/lib/influxdb
      - data_influxdb_config:/etc/influxdb
    ports:
      - ${INFLUXDB_DB_PORT}:8086
    environment:
      - INFLUXDB_DATA_ENGINE=tsm1
      - INFLUXDB_REPORTING_DISABLED=false
      - INFLUXDB_ADMIN_USER=${INFLUXDB_ADMIN_USER}
      - INFLUXDB_ADMIN_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - INFLUXDB_USER=${INFLUXDB_USER}
      - INFLUXDB_USER_PASSWORD=${INFLUXDB_USER_PASSWORD}
      - INFLUXDB_READ_USER=${INFLUXDB_READ_USER}
      - INFLUXDB_READ_USER_PASSWORD=${INFLUXDB_READ_USER_PASSWORD}
      - INFLUXDB_DB=${INFLUXDB_OPENHAB_DB}
      - TZ=${TZ}
    networks:
      wsn-bridge:
        aliases:
        - db

  mqtt-broker:
    image: eclipse-mosquitto:latest
    container_name: mqtt-broker
    restart: always
    ports:
      - 1883:1883
    volumes:
      - ./configs/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - data_mosquitto:/mosquitto/data
      - data_mosquitto_log:/mosquitto/log
    networks:
      wsn-bridge:
        aliases:
        - mqtt
        
  edge-agent:
    profiles: ["edge"]
    build:
      context: ./edge_agent       
      dockerfile: Dockerfile 
    container_name: edge-agent
    restart: unless-stopped
    depends_on:
      - openhab
      - mqtt-broker
    volumes:
      - ./configs/edge_agent_config.yaml:/app/config.yaml:ro
    environment:
      - SITE_ID=${SITE_ID}
      - MQTT_HOST=${MQTT_HOST}   
      - MQTT_PORT=${MQTT_PORT}
      - MQTT_TLS=${MQTT_TLS}
      - MQTT_USERNAME=${MQTT_USERNAME} 
      - MQTT_PASSWORD=${MQTT_PASSWORD} 
      - MQTT_COMMAND_TOPIC=openhab/${SITE_ID}/command
      - MQTT_RESPONSE_TOPIC=openhab/${SITE_ID}/response
      - MQTT_STATUS_TOPIC=openhab/${SITE_ID}/status
      - MQTT_DATA_TOPIC=openhab/${SITE_ID}/data
      - OH_BASE_URL=http://oh:8080
      - OH_TOKEN=${OH_TOKEN}
      - TELEMETRY_INTERVAL_SEC=60
      - HEARTBEAT_INTERVAL_SEC=30
      - TZ=${TZ}
#    secrets:
#      - mqtt_ca
#      - mqtt_client_crt
#      - mqtt_client_key
#    volumes:
#      - /etc/ssl/certs:/etc/ssl/certs:ro
    networks:
      wsn-bridge:
        aliases:
          - edge-agent

  openhab-exporter:
    profiles: ["edge"]
    build:
      context: ./openhab_exporter     
      dockerfile: Dockerfile   
    container_name: openhab-exporter
    restart: always
    depends_on:
      - openhab
      - mqtt-broker
    volumes:
      - ./configs/exporter_config.yaml:/app/config.yaml:ro
    environment:
      - TZ=${TZ}
      - SITE_ID=${SITE_ID}
      - OH_TOKEN=${OH_TOKEN}
      - OH_BASE_URL=http://oh:8080
      - MQTT_HOST=${MQTT_HOST}    
      - MQTT_PORT=${MQTT_PORT}    
      - MQTT_TLS=${MQTT_TLS} 
      - MQTT_USERNAME=${MQTT_USERNAME} 
      - MQTT_PASSWORD=${MQTT_PASSWORD}          
#    secrets:
#      - mqtt_ca
#      - mqtt_client_crt
#      - mqtt_client_key
    networks:
      wsn-bridge:
        aliases:
          - exporter

volumes:
  data_openhab_conf:
  data_openhab_addons:
  data_openhab_userdata:
  data_influxdb:
  data_influxdb_config:
  data_mosquitto:
  data_mosquitto_log:

networks:
  wsn-bridge:
    driver: bridge
